name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm --prefix packages/cli run build

      - name: Run Unit Tests
        run: npm --prefix packages/cli test

      - name: Verify CLI list command
        run: node packages/cli/dist/index.js list

      - name: Build and check documentation
        run: |
          npm run docs:build
          npm run docs:check

      - name: Run End-to-End Ghost Theme Validation
        run: |
          cd example-theme
          node ../packages/cli/dist/index.js init -y
          node ../packages/cli/dist/index.js add newsletter-form -y
          node ../packages/cli/dist/index.js add pricing-table -y
          node ../packages/cli/dist/index.js add author-card -y
          node ../packages/cli/dist/index.js add post-card -y
          npx --yes gscan@6.4.2 .

  real-ghost-browser:
    name: Real Ghost browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned isolated Ghost runtime
        run: npm install --prefix .ghost-runtime --no-audit --no-fund ghost@6.63.0
      - name: Install headless browser
        run: npx playwright install --with-deps chromium
      - name: Verify documentation preview interactions
        run: |
          npm run docs:build
          npm run docs:check
          npm run docs:browser
      - name: Run real Ghost matrix
        env:
          GHOST_E2E_ROOT: ${{ github.workspace }}/.ghost-runtime/node_modules/ghost
        run: npm run test:e2e
      - name: Save reports, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ghost-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
